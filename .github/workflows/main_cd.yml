name: Create a release on NuGet

on:
  push:
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+"
      - "v[0-9]+\\.[0-9]+\\.[0-9]+-pre"

permissions:
  contents: read     # Required for actions/checkout and git operations
  id-token: write    # Required for OpenID Connect (OIDC) trusted publishing

jobs:
  release-nuget:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore workloads
        run: dotnet workload restore MAUI.FreakyControls/MAUI.FreakyControls.sln

      - name: Verify commit exists in origin/master
        shell: pwsh
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          if (-not (git branch --remote --contains | Select-String "origin/master")) {
            throw "Tag is not on origin/master. Aborting release."
          }

      - name: Extract version from tag
        id: get_version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.TrimStart("v")
          echo "version_without_v=$version" >> $env:GITHUB_OUTPUT

      - name: Build Release
        run: dotnet build MAUI.FreakyControls\MAUI.FreakyControls\Maui.FreakyControls.csproj -c Release

      - name: Pack NuGet package
        run: |
          dotnet pack MAUI.FreakyControls\MAUI.FreakyControls\Maui.FreakyControls.csproj `
            -c Release `
            -p:PackageVersion=${{ steps.get_version.outputs.version_without_v }}

      - name: Authenticate with NuGet (OIDC trusted publishing)
        id: nuget_auth
        uses: NuGet/login@v1
        with:
          user: FreakyAli
          token-service-url: https://www.nuget.org/api/v2/token
          audience: https://www.nuget.org

      - name: Push NuGet package to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_auth.outputs.NUGET_API_KEY }}
        run: |
          $version = "${{ steps.get_version.outputs.version_without_v }}"
          $nupkgs = Get-ChildItem -Recurse -Filter *.nupkg | Where-Object {
            $_.FullName -like "*$version*" -and $_.FullName -notlike "*.symbols.nupkg"
          }

          if ($nupkgs.Count -ne 1) {
            throw "Expected exactly one matching .nupkg, found $($nupkgs.Count)"
          }

          dotnet nuget push $nupkgs[0].FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
